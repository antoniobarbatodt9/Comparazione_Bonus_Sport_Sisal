<html lang="it"><head><meta charset="utf-8">
<title>Bonus Sport · famiglia verticale (300x600 · 320x480 · 160x600) — STORYBOARD</title>
<!--
  FAMIGLIA VERTICALE del master 970x250 (concept M rev.2). Stessi asset, token, font, loghi, testi.
  Parametri URL: size=300x600|320x480|160x600 · t=<s> · mode=final|wire · safe=1 · grid=1 · bgmode=drift|still
  Durata 10,0 s = 250 fotogrammi a 25 fps. Audio: nessuno.

<style>
  @font-face { font-family:"Montserrat"; font-weight:800; src:url("../../../08_progetto/assets/font/Montserrat-800.woff2") format("woff2"); }
  @font-face { font-family:"Inter"; font-weight:600; src:url("../../../08_progetto/assets/font/Inter-600.woff2") format("woff2"); }
  :root { --sisal-green:#00643a; --sisal-lime:#b9d531; --lime-hi:#e6ff8a; --ground-0:#061a12; --text:#fff; --text-dim:rgba(255,255,255,0.74);
    --card-bg:rgba(6,26,18,0.80); --card-bg-2:rgba(255,255,255,0.025); --card-border:rgba(255,255,255,0.13);
    --font-display:"Montserrat","Inter",Arial,sans-serif; --font-ui:"Inter","Montserrat",Arial,sans-serif; }
  html,body{margin:0;background:#000}
  #stage{position:relative;overflow:hidden;background:var(--ground-0);font-family:var(--font-ui);color:var(--text)}
  #stage *{box-sizing:border-box}
  .abs{position:absolute}
  #env{position:absolute;inset:0;overflow:hidden} #env>div{position:absolute}
  #env .img{background-size:cover;background-position:center;will-change:transform;filter:brightness(1.06) contrast(1.04)}
  #env .tint{inset:0;background:linear-gradient(180deg,rgba(0,100,58,.70),rgba(0,84,48,.70));mix-blend-mode:color}
  #env .tint2{inset:0;background:rgba(0,100,58,.12);mix-blend-mode:screen}
  #env .flare{border-radius:50%;opacity:0;background:radial-gradient(closest-side,rgba(255,250,225,.55),rgba(255,250,225,.18) 35%,rgba(255,250,225,0) 70%)}
  #env .tone{inset:0;background:linear-gradient(180deg,rgba(6,26,18,.42) 0%,rgba(6,26,18,.10) 50%,rgba(6,26,18,.55) 100%)}
  #env .vignette{inset:0;background:radial-gradient(75% 75% at 50% 45%,rgba(0,0,0,0) 55%,rgba(0,0,0,.5) 100%)}
  #env .shade{border-radius:60px;background:rgba(4,18,12,.28);filter:blur(26px)}
  #particles i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:0}
  .scene{position:absolute;inset:0;will-change:clip-path}
  .w{position:absolute;font-family:var(--font-display);font-weight:800;text-transform:uppercase;white-space:nowrap;text-align:center;left:0;right:0}
  .clip{position:absolute;left:0;right:0;overflow:hidden}
  .w1{color:#fff} .w2{color:var(--sisal-lime)}
  .rule{position:absolute;height:2px;background:var(--sisal-lime);opacity:.9}
  .card{position:absolute;border-radius:12px;overflow:hidden;background:linear-gradient(180deg,var(--card-bg-2),rgba(255,255,255,.02)),var(--card-bg);border:1px solid var(--card-border);box-shadow:0 10px 28px rgba(0,0,0,.30);transform-origin:50% 100%}
  .card .logo{position:absolute;left:0;right:0;display:flex;align-items:center;justify-content:center;opacity:0} .card .logo img{display:block}
  .card .fino{position:absolute;left:0;right:0;text-align:center;font-family:var(--font-ui);font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--text-dim);opacity:0}
  .card .valwrap{position:absolute;left:0;right:0;overflow:hidden;text-align:center}
  .card .val{display:inline-block;font-family:var(--font-display);font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap} .card .val span{display:inline-block}
  #cta{position:absolute;border-radius:999px;background:var(--sisal-lime);color:#06301d;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;box-shadow:0 8px 22px rgba(0,0,0,.30),0 0 0 1px rgba(255,255,255,.08) inset;z-index:5}
  #wipe{position:absolute;left:-40px;right:-40px;height:120px;opacity:0;z-index:6;transform:skewY(-6deg);background:linear-gradient(180deg,rgba(230,255,138,0) 0%,rgba(255,255,255,.55) 45%,rgba(230,255,138,.35) 60%,rgba(230,255,138,0) 100%);mix-blend-mode:screen}
  #safe{position:absolute;left:0;right:0;bottom:0;background:var(--ground-0);z-index:9}
  #safe::before{content:'';position:absolute;left:0;right:0;bottom:100%;height:22px;background:linear-gradient(180deg,rgba(6,26,18,0),rgba(6,26,18,.85));pointer-events:none}
  #safe.show::before{display:none}
  #safe.show{background:repeating-linear-gradient(45deg,#061a12 0 6px,#0d2a1e 6px 12px);outline:1px dashed #ff2fd0;outline-offset:-1px}
  #safe.show span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:600 8px/1.2 var(--font-ui);color:#ff2fd0;text-align:center;padding:0 4px;letter-spacing:.04em}
  /* WIREFRAME */
  body.wire #env,body.wire #particles{visibility:hidden}
  body.wire #stage{background:#0b1f17}
  body.wire .card,body.wire #cta,body.wire .clip,body.wire .rule{outline:1px dashed #b9d531;outline-offset:-1px;background:rgba(185,213,49,.10)!important;box-shadow:none!important;border-color:transparent!important}
  body.wire .card .logo img{visibility:hidden} body.wire .card .logo{outline:1px dotted #fff;opacity:1!important}
  body.wire .card .logo::after{content:attr(data-lbl);position:absolute;color:#fff;font:600 8px var(--font-ui);letter-spacing:.06em}
  body.wire .w,body.wire .card .fino,body.wire .card .val{color:rgba(255,255,255,.55)!important}
  body.wire #cta{color:rgba(6,48,29,.7)!important}
  #grid{position:absolute;inset:0;pointer-events:none;z-index:8;display:none} #grid.show{display:block}
  #grid .col{position:absolute;top:0;bottom:0;background:rgba(255,47,208,.10);border-left:1px solid rgba(255,47,208,.35);border-right:1px solid rgba(255,47,208,.35)}
  #grid .h{position:absolute;left:0;right:0;height:0;border-top:1px dashed rgba(255,47,208,.6)} #grid .h b{position:absolute;right:2px;top:-9px;font:600 7px var(--font-ui);color:#ff2fd0}
  #grid .axis{position:absolute;top:0;bottom:0;width:0;border-left:1px solid rgba(255,255,255,.45)}
</style></head>
<body>

    <div class="clip" id="c5a"><div class="w w1" id="t1">Bonus</div></div><div class="clip" id="c5b"><div class="w w2" id="t2">Sport</div></div><div class="rule" id="r5"></div>
    <div class="card k" data-op="sisal"><div class="logo" data-lbl="LOGO SISAL"><img src="../../../08_progetto/assets/loghi/Sisal_white_neg_LRES.png" alt="Sisal"></div><div class="fino">Fino a</div><div class="valwrap"><div class="val">5.200€</div></div></div>
    <div class="card k" data-op="netbet"><div class="logo" data-lbl="LOGO NETBET"><img src="../../../08_progetto/assets/loghi/NetBet_PrimaryLogo_White.png" alt="NetBet"></div><div class="fino">Fino a</div><div class="valwrap"><div class="val">1.000€</div></div></div>
    <div class="card k" data-op="williamhill"><div class="logo" data-lbl="LOGO WILLIAM HILL"><img src="../../../08_progetto/assets/loghi/WilliamHill_white.png" alt="William Hill"></div><div class="fino">Fino a</div><div class="valwrap"><div class="val">255€</div></div></div>
  </div>

</div>
<script>
// ---------- LAYOUT per size (px) — vedi <size>/layout_spec.md
const LAYOUTS = {
  '300x600': { W:300, H:600, safe:60, m:24, cols:6, gutter:12,
    s1:{ fs:46, lh:50, y1:176, y2:226, rule:{x:90,y:288,w:120}, cta:{x:40,y:316,w:220,h:52,fs:18} },
    hero:{ x:24,y:140,w:252,h:176, logo:{top:20,h:64,w:[150,142,175]}, fino:{top:96,fs:13}, val:{top:114,fs:34,lh:40}, cta:{x:50,y:350,w:200,h:48,fs:17} },
    s5:{ title:{mode:'line',fs:26,lh:30,y:32}, rule:{x:128,y:70,w:44}, cards:{x:24,ys:[84,200,316],w:252,h:104, logo:{top:12,h:32,w:[100,95,117]}, fino:{top:52,fs:11}, val:{top:66,fs:24,lh:30}}, cta:{x:50,y:444,w:200,h:48,fs:17} },
    env:{ pad:40 }, particles:14, flare:{x:-60,y:-120,w:420,h:300}, shade:{x:24,y:90,w:252,h:380} },
  '320x480': { W:320, H:480, safe:50, m:20, cols:6, gutter:12,
    s1:{ fs:40, lh:44, y1:130, y2:174, rule:{x:110,y:230,w:100}, cta:{x:60,y:254,w:200,h:46,fs:17} },
    hero:{ x:20,y:96,w:280,h:160, logo:{top:16,h:56,w:[150,142,175]}, fino:{top:84,fs:12}, val:{top:100,fs:32,lh:38}, cta:{x:70,y:284,w:180,h:44,fs:16} },
    s5:{ title:{mode:'line',fs:24,lh:28,y:24}, rule:{x:140,y:58,w:40}, cards:{x:20,ys:[70,164,258],w:280,h:84, logo:{top:8,h:30,w:[88,84,103]}, fino:{top:44,fs:10}, val:{top:56,fs:22,lh:26}}, cta:{x:70,y:360,w:180,h:44,fs:16} },
    env:{ pad:40 }, particles:12, flare:{x:-40,y:-110,w:400,h:280}, shade:{x:20,y:60,w:280,h:300} },
  '160x600': { W:160, H:600, safe:56, m:12, cols:4, gutter:8, pulse:[0.07,0.05],
    s1:{ fs:30, lh:34, y1:200, y2:234, rule:{x:50,y:280,w:60}, cta:{x:12,y:300,w:136,h:40,fs:12} },
    hero:{ x:12,y:150,w:136,h:150, logo:{top:16,h:48,w:[104,99,122]}, fino:{top:74,fs:10.5}, val:{top:90,fs:26,lh:32}, cta:{x:12,y:330,w:136,h:40,fs:12} },
    s5:{ title:{mode:'stack',fs:20,lh:22,y1:26,y2:48}, rule:{x:60,y:78,w:40}, cards:{x:12,ys:[92,208,324],w:136,h:108, logo:{top:10,h:36,w:[86,82,100]}, fino:{top:52,fs:10}, val:{top:66,fs:21,lh:26}}, cta:{x:12,y:456,w:136,h:40,fs:12} },
    env:{ pad:40 }, particles:8, flare:{x:-90,y:-120,w:340,h:260}, shade:{x:12,y:100,w:136,h:400} },
};
// ---------- TIMELINE (10,0 s) — stessa sequenza narrativa del master 12 s, compressa
const S = { s1:[0.00,2.00], t1:[2.00,2.30], s2:[2.30,3.80], t2:[3.80,4.10], s3:[4.10,5.60], t3:[5.60,5.90], s4:[5.90,7.40], t4:[7.40,7.70], s5:[7.70,10.00] };
const CTA_IN=[0.90,1.30], MORPH1=[1.90,2.40], MORPH2=[7.25,7.70], PULSE1=8.90, PULSE2=9.55;
const q=new URLSearchParams(location.search); const size=q.get('size')||'300x600'; const L=LAYOUTS[size]; const t=parseFloat(q.get('t')||'0'); const still=(q.get('bgmode')||'drift')==='still';
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)); const lerp=(a,b,p)=>a+(b-a)*p; const prog=(t,[a,b])=>clamp((t-a)/(b-a));
const eoE=p=>p>=1?1:1-Math.pow(2,-10*p), eoC=p=>1-Math.pow(1-p,3), eio=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2, eioC=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2, eoQ=p=>1-Math.pow(1-p,5);
const $=s=>document.querySelector(s); const stage=$('#stage'); stage.style.width=L.W+'px'; stage.style.height=L.H+'px';
if((q.get('mode')||'final')==='wire') document.body.classList.add('wire');
const usable=L.H-L.safe;
// ---------- ambiente: riframe verticale dello stesso asset Higgsfield (800x1200 = fascia centrale 896x1344 del job e190625a)
const envimg=$('#envimg'); const pad=L.env.pad; envimg.style.left=(-pad)+'px'; envimg.style.top=(-pad)+'px'; envimg.style.width=(L.W+2*pad)+'px'; envimg.style.height=(L.H+2*pad)+'px';
envimg.style.backgroundImage='url("../../../08_progetto/assets/env/env_M_pitch_topdown_VERT_896x1344.jpg")';
const d=still?0:t/10; const cams={s1:[0,1.06],s2:[-6,1.02],s3:[5,1.03],s4:[-3,1.04],s5:[0,1.0]};
const cur=Object.keys(S).filter(k=>k[0]==='s').find(k=>t>=S[k][0]&&t<S[k][1])||'s5'; const cam=cams[cur];
envimg.style.transform=`translateY(${cam[0]-8*d}px) scale(${cam[1]+0.03-0.03*d})`; envimg.style.opacity=eoC(prog(t,[0,0.6]));
const fl=$('#flare'); Object.assign(fl.style,{left:L.flare.x+'px',top:L.flare.y+'px',width:L.flare.w+'px',height:L.flare.h+'px'}); fl.style.opacity=0.6*eoE(prog(t,[0.1,0.5]))*lerp(1,0.38,eio(prog(t,[0.5,1.4])));
const sh=$('#shade'); Object.assign(sh.style,{left:L.shade.x+'px',top:L.shade.y+'px',width:L.shade.w+'px',height:L.shade.h+'px'});
// particelle deterministiche (mai sotto usable-6)
{ const P=$('#particles'); let s=7; const rnd=()=>{s=(s*9301+49297)%233280;return s/233280;};
  for(let i=0;i<L.particles;i++){ const e=document.createElement('i'); const x=rnd()*L.W, y=rnd()*(usable-12)+4, ph=rnd()*6.28, sp=0.4+rnd()*0.8;
    const a=0.35*clamp((t-0.4-i*0.05)/0.8)*(0.6+0.4*Math.sin(ph+t*1.3)); e.style.left=(x+(still?0:Math.sin(ph+t*sp)*3))+'px'; e.style.top=(y+(still?0:-t*1.2))+'px'; e.style.opacity=a; P.appendChild(e);} }
// ---------- scene attive + wipe verticale (banda che scende)
const scenes={s1:$('#s1'),s2:$('#s2'),s3:$('#s3'),s4:$('#s4'),s5:$('#s5')}; Object.values(scenes).forEach(s=>s.style.display='none');
const order=['s1','s2','s3','s4','s5'], trans=[S.t1,S.t2,S.t3,S.t4]; const wipe=$('#wipe'); wipe.style.opacity=0;
let ti=trans.findIndex(w=>t>=w[0]&&t<w[1]);
if(ti>=0){ const p=eio(prog(t,trans[ti])); const out=scenes[order[ti]], inn=scenes[order[ti+1]];
  out.style.display='block'; inn.style.display='block'; out.style.clipPath=`inset(${p*100}% 0 0 0)`; inn.style.clipPath=`inset(0 0 ${(1-p)*100}% 0)`;
  wipe.style.opacity=Math.sin(p*Math.PI); wipe.style.top=`${-120+p*(usable+120)}px`;
} else { scenes[cur].style.display='block'; scenes[cur].style.clipPath='none'; }
// ---------- S1: BONUS → SPORT → CTA, righe impilate centrate
function setWord(clipId,wId,top,fs,lh,p){ const c=document.getElementById(clipId), w=document.getElementById(wId); c.style.top=top+'px'; c.style.height=lh+'px'; w.style.fontSize=fs+'px'; w.style.lineHeight=lh+'px';
  w.style.transform=`translateY(${(1-p)*104}%)`; w.style.letterSpacing=`${lerp(0.14,-0.01,p)}em`; w.style.opacity=clamp(p*3); }
setWord('c1','w1',L.s1.y1,L.s1.fs,L.s1.lh,eoE(prog(t,[0.20,0.80]))); setWord('c2','w2',L.s1.y2,L.s1.fs,L.s1.lh,eoE(prog(t,[0.38,0.98])));
{ const r=$('#r1'); const p=eoC(prog(t,[0.9,1.3])); r.style.left=(L.s1.rule.x+L.s1.rule.w/2*(1-p))+'px'; r.style.top=L.s1.rule.y+'px'; r.style.width=(L.s1.rule.w*p)+'px'; }
// ---------- card (hero e S5): stessa struttura interna, misure per size
function layoutCard(card,box,spec,opIdx){ Object.assign(card.style,{left:box.x+'px',top:box.y+'px',width:box.w+'px',height:box.h+'px'});
  const lg=card.querySelector('.logo'); Object.assign(lg.style,{top:spec.logo.top+'px',height:spec.logo.h+'px'}); lg.querySelector('img').style.width=spec.logo.w[opIdx]+'px';
  const fi=card.querySelector('.fino'); Object.assign(fi.style,{top:spec.fino.top+'px',fontSize:spec.fino.fs+'px',lineHeight:(spec.fino.fs+3)+'px'});
  const vw=card.querySelector('.valwrap'); Object.assign(vw.style,{top:spec.val.top+'px',height:spec.val.lh+'px'}); const v=vw.querySelector('.val'); v.style.fontSize=spec.val.fs+'px'; v.style.lineHeight=spec.val.lh+'px'; }
function animateCard(card,u,T){ // T: tempi relativi {hero:[a,b], logo, fino, digitsEnd, digitsDur}
  const ph=eoE(prog(u,T.hero)); card.style.opacity=clamp(ph*1.6); card.style.transform=`translateY(${(1-ph)*T.rise}px) rotateX(${(1-ph)*14}deg)`; card.style.filter=`blur(${(1-ph)*5}px)`;
  const pl=eoC(prog(u,T.logo)); const lg=card.querySelector('.logo'); lg.style.opacity=pl; lg.style.transform=`scale(${lerp(0.94,1,pl)})`;
  card.querySelector('.fino').style.opacity=eoC(prog(u,T.fino));
  const v=card.querySelector('.val'); if(!v.dataset.split){v.innerHTML=[...v.textContent].map(c=>`<span>${c}</span>`).join('');v.dataset.split=1;}
  const sp=v.querySelectorAll('span'); const n=sp.length; sp.forEach((s,i)=>{const st=T.digitsEnd-T.digitsDur-(n-1-i)*0.03; const p=eoQ(prog(u,[st,st+T.digitsDur])); s.style.transform=`translateY(${(1-p)*40}px)`; s.style.opacity=clamp(p*2);}); }
const ops=['sisal','netbet','williamhill'];
[['s2',S.s2],['s3',S.s3],['s4',S.s4]].forEach(([id,win],k)=>{ const card=scenes[id].querySelector('.hero'); layoutCard(card,L.hero,L.hero,k);
  animateCard(card,t-win[0],{hero:[0,0.42],rise:26,logo:[0.25,0.58],fino:[0.50,0.70],digitsEnd:0.95,digitsDur:0.36}); });
// ---------- S5: titolo + tre card impilate (entrano insieme, dati già noti)
{ const u=t-S.s5[0]+0.15; const T=L.s5.title;
  if(T.mode==='line'){ // una riga "BONUS SPORT": due clip sovrapposte centrate con parole affiancate → uso una sola riga composta
    const c=document.getElementById('c5a'), w=document.getElementById('t1'); c.style.top=T.y+'px'; c.style.height=T.lh+'px'; w.innerHTML='<span style="color:#fff">Bonus</span> <span style="color:var(--sisal-lime)">Sport</span>'; w.style.fontSize=T.fs+'px'; w.style.lineHeight=T.lh+'px';
    const p=eoE(prog(u,[0,0.55])); w.style.transform=`translateY(${(1-p)*104}%)`; w.style.letterSpacing=`${lerp(0.10,-0.01,p)}em`; w.style.opacity=clamp(p*3); document.getElementById('c5b').style.display='none';
  } else { setWord('c5a','t1',T.y1,T.fs,T.lh,eoE(prog(u,[0,0.55]))); setWord('c5b','t2',T.y2,T.fs,T.lh,eoE(prog(u,[0.08,0.63]))); }
  const r=$('#r5'); const pr=eoC(prog(u,[0.35,0.75])); r.style.left=(L.s5.rule.x+L.s5.rule.w/2*(1-pr))+'px'; r.style.top=L.s5.rule.y+'px'; r.style.width=(L.s5.rule.w*pr)+'px';
  document.querySelectorAll('#s5 .k').forEach((card,k)=>{ layoutCard(card,{x:L.s5.cards.x,y:L.s5.cards.ys[k],w:L.s5.cards.w,h:L.s5.cards.h},L.s5.cards,k);
    const p=eoE(prog(u,[0.05+k*0.06,0.65+k*0.06])); card.style.opacity=clamp(p*1.6); card.style.transform=`translateY(${(1-p)*12}px) rotateX(${(1-p)*14}deg)`; card.style.filter=`blur(${(1-p)*4}px)`;
    card.querySelector('.logo').style.opacity=1; card.querySelector('.fino').style.opacity=1; const v=card.querySelector('.val'); if(!v.dataset.split){v.innerHTML=[...v.textContent].map(c=>`<span>${c}</span>`).join('');v.dataset.split=1;} }); }
// ---------- CTA unica: entra terza in S1, morph verticale S1→hero→S5, pulse finale (due battiti, ancorata in basso a destra della propria box)
{ const big=L.s1.cta, mid=L.hero.cta, small=L.s5.cta; const pin=eoE(prog(t,CTA_IN)); const pm1=eioC(prog(t,MORPH1)), pm2=eioC(prog(t,MORPH2));
  const K=k=>lerp(lerp(big[k],mid[k],pm1),small[k],pm2); const cx=K('x'),cy=K('y'),cw=K('w'),ch=K('h'),cfs=K('fs');
  const pulse=(u,a)=>{const x=prog(t,[u,u+0.55]); return x>0&&x<1?a*Math.sin(x*Math.PI):0;}; const PA=L.pulse||[0.09,0.06]; const sc=1+pulse(PULSE1,PA[0])+pulse(PULSE2,PA[1]);
  const cta=$('#cta'); Object.assign(cta.style,{left:cx+'px',top:cy+'px',width:cw+'px',height:ch+'px',fontSize:cfs+'px'}); cta.style.transformOrigin='50% 50%';
  cta.style.transform=`translateY(${(1-pin)*18}px) scale(${lerp(0.7,1,pin)*sc})`; cta.style.opacity=clamp(pin*2.5); }
// ---------- safe area + griglia
const safe=$('#safe'); safe.style.height=L.safe+'px'; if(q.get('safe')==='1'){ safe.classList.add('show'); safe.querySelector('span').textContent=`SAFE AREA DISCLAIMER · ${L.W}×${L.safe} px · y ${usable}–${L.H} · libera (ADM / 18+ / diciture)`; }
if(q.get('grid')==='1'){ const g=$('#grid'); g.classList.add('show'); const cw=(L.W-2*L.m-(L.cols-1)*L.gutter)/L.cols;
  for(let i=0;i<L.cols;i++){ const c=document.createElement('div'); c.className='col'; c.style.left=(L.m+i*(cw+L.gutter))+'px'; c.style.width=cw+'px'; g.appendChild(c); }
  const ax=document.createElement('div'); ax.className='axis'; ax.style.left=(L.W/2)+'px'; g.appendChild(ax);
  const rows=[['margine sup.',L.m],['centro ottico',Math.round(usable/2)-6],['safe',usable]]; rows.forEach(([n,y])=>{ const h=document.createElement('div'); h.className='h'; h.style.top=y+'px'; h.innerHTML=`<b>${n} ${y}</b>`; g.appendChild(h); }); }
window.__L=L; window.__ready=true;
</script>
